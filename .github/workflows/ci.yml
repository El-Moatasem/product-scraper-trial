name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Laravel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v3
        with:
          php-version: "8.5"
          extensions: curl, dom, mbstring, pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: backend
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: composer test
      - run: vendor/bin/pint --test

  frontend:
    name: Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  proxy-service:
    name: Go proxy manager
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: proxy-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.0"
          cache-dependency-path: proxy-service/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go test -race ./...
      - run: go vet ./...
